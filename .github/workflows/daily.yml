name: Risposta Mail Automatica

# Gira ogni 3 ore dalle 8:00 alle 17:00 ora italiana (8, 11, 14, 17).
# NOTA: il cron di GitHub Actions usa UTC e NON gestisce l'ora legale.
#   - Ora legale (estate, CEST = UTC+2): 8/11/14/17 IT = 6/9/12/15 UTC  <-- impostato qui
#   - Ora solare (inverno, CET = UTC+1): 8/11/14/17 IT = 7/10/13/16 UTC
# Attualmente è impostato per l'ora legale. In inverno aggiungi 1 alle ore UTC.
on:
  schedule:
    - cron: "0 6,9,12,15 * * *"
  workflow_dispatch:   # permette anche l'avvio manuale dal tab Actions

jobs:
  rispondi-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Ricostruisci credentials.json e token.json dai secret
        run: |
          echo '${{ secrets.GMAIL_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.GMAIL_TOKEN_JSON }}' > token.json

      - name: Esegui lo script
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GMAIL_LABEL: ${{ vars.GMAIL_LABEL }}
          PROCESSED_LABEL: ${{ vars.PROCESSED_LABEL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          AI_MAX_RETRIES: ${{ vars.AI_MAX_RETRIES }}
          AI_RETRY_WAIT_SECONDS: ${{ vars.AI_RETRY_WAIT_SECONDS }}
        run: python auto_mail_responder.py

      - name: Salva il token aggiornato (se rinnovato)
        run: |
          echo "Il token potrebbe essere stato rinnovato durante l'esecuzione."
          echo "Se usi un refresh token a lunga durata, non serve fare nulla."
